name: Generate Profile

on:
  workflow_dispatch:
    inputs:
      keepalive:
        description: "PersistentKeepalive interval in seconds (empty = omit)"
        required: false
        default: ""
  push:
    branches: [ci/generate-profile]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch Go version
        run: |
          GO_VERSION=$(perl -ne 'print "$1\n" if /FROM golang:([0-9.]+)/' Dockerfile | head -n1)
          [ -n "$GO_VERSION" ] || exit 1
          echo "go_version=$GO_VERSION" >> $GITHUB_ENV

      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "${{ env.go_version }}"

      - name: Program Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o wgcf

      - name: Register account
        run: ./wgcf register --accept-tos

      - name: Generate profile
        env:
          KEEPALIVE: ${{ github.event.inputs.keepalive }}
        run: |
          if [ -n "$KEEPALIVE" ]; then
            ./wgcf generate --keepalive="$KEEPALIVE"
          else
            ./wgcf generate
          fi

      - name: Show profile summary
        # Private key is redacted; the full file is in the uploaded artifact
        run: sed -E 's/^(PrivateKey *= *).*/\1<redacted>/' wgcf-profile.conf

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: wgcf-profile
          path: |
            wgcf-profile.conf
            wgcf-account.toml
          retention-days: 1
